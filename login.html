<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Login</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
body {
    margin: 0;
    height: 100vh;
    overflow: hidden;
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
    display: flex;
    justify-content: center;
    align-items: center;
}

.bubble {
    position: absolute;
    border-radius: 50%;
    filter: blur(20px);
    animation: float 12s infinite ease-in-out;
    opacity: 0.6;
}

.b1 { width: 220px; height: 220px; background: #00c6ff; top: 10%; left: 10%; }
.b2 { width: 160px; height: 160px; background: #ff00cc; bottom: 10%; right: 10%; }
.b3 { width: 120px; height: 120px; background: #00ffcc; top: 70%; left: 20%; }

@keyframes float {
    0% { transform: translateY(0px); }
    50% { transform: translateY(-50px); }
    100% { transform: translateY(0px); }
}

.road-light {
    position: absolute;
    bottom: 30px;
    width: 80px;
    height: 4px;
    background: linear-gradient(90deg, transparent, #00c6ff, transparent);
    animation: moveLight 6s linear infinite;
}

.road-light:nth-child(2) { animation-delay: 3s; }

@keyframes moveLight {
    from { left: -100px; }
    to { left: 110%; }
}

.login-box {
    backdrop-filter: blur(25px);
    background: rgba(255,255,255,0.08);
    padding: 40px;
    border-radius: 20px;
    width: 340px;
    text-align: center;
    box-shadow: 0 10px 50px rgba(0,0,0,0.6);
    animation: fadeIn 1s ease;
}

@keyframes fadeIn {
    from { opacity: 0; transform: scale(0.9) translateY(20px); }
    to   { opacity: 1; transform: scale(1) translateY(0); }
}

h2 {
    margin-bottom: 25px;
    font-size: 24px;
    background: linear-gradient(45deg, #00c6ff, #00ffc6);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}

input, select {
    width: 100%;
    padding: 12px;
    margin: 12px 0;
    border: none;
    border-radius: 10px;
    background: rgba(255,255,255,0.15);
    color: white;
    outline: none;
    transition: 0.3s;
    box-sizing: border-box;
}

input:focus, select:focus {
    box-shadow: 0 0 15px #00c6ff;
    transform: scale(1.02);
}

select {
    appearance: none;
    -webkit-appearance: none;
    cursor: pointer;
}

select option {
    background: #203a43;
    color: white;
}

button {
    width: 100%;
    padding: 12px;
    margin-top: 15px;
    border: none;
    border-radius: 10px;
    background: linear-gradient(135deg, #00c6ff, #0072ff);
    color: white;
    font-size: 16px;
    cursor: pointer;
    transition: 0.3s;
}

button:hover {
    transform: scale(1.07);
    box-shadow: 0 0 25px #00c6ff;
}

.links {
    margin-top: 10px;
    font-size: 12px;
    color: #ccc;
}

.error-msg {
    color: #ff6b6b;
    font-size: 13px;
    margin-top: 8px;
    display: none;
}
</style>
</head>

<body>

<div class="bubble b1"></div>
<div class="bubble b2"></div>
<div class="bubble b3"></div>

<div class="road-light"></div>
<div class="road-light"></div>

<div class="login-box">

    <h2><i class="fas fa-car"></i> Smart Parking</h2>

    <input type="text" id="emailInput" placeholder="Email">
    <input type="password" id="passwordInput" placeholder="Password">

    <select id="role">
        <option value="">Select Role</option>
        <option value="student">Student</option>
        <option value="teacher">Teacher</option>
        <option value="other">Other</option>
        <option value="admin">Admin</option>
    </select>

    <p class="error-msg" id="errorMsg"><i class="fas fa-circle-exclamation"></i> Please fill in all fields.</p>

    <button onclick="login()">
        <i class="fas fa-right-to-bracket"></i> Sign In
    </button>

    <div class="links">
        Forgot password? | Sign up
    </div>

</div>

<script>
function login() {
    let email    = document.getElementById("emailInput").value.trim();
    let password = document.getElementById("passwordInput").value.trim();
    let role     = document.getElementById("role").value;
    let errorMsg = document.getElementById("errorMsg");

    if (!email || !password || !role) {
        errorMsg.style.display = "block";
        return;
    }

    errorMsg.style.display = "none";

    // Use localStorage so it persists across page navigations
    localStorage.setItem("parkingUser",  email);
    localStorage.setItem("parkingRole",  role);
    localStorage.setItem("parkingEmail", email);
  sessionStorage.setItem("loggedIn", "true");
    if (role === "admin") {
        window.location.href = "admin.html";
    } else {
        window.location.href = "user.html";
    }
}
</script>

</body>
</html>
